<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X 粉丝数 · 本地模拟验证</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#0f1419;background:#f7f9fa}
    *{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:24px auto;background:#fff;border:1px solid #eff3f4;border-radius:16px;overflow:hidden}a{color:inherit;text-decoration:none;min-width:0}
    .banner{padding:22px 26px 20px;border-bottom:1px solid #eff3f4}.eyebrow{color:#1d9bf0;font-weight:700;font-size:11px;letter-spacing:1.4px}h1{font-size:23px;letter-spacing:-.7px;margin:7px 0}.note{font-size:12px;color:#536471;margin:0;line-height:1.6}
    nav{display:flex;justify-content:space-around;border-bottom:1px solid #eff3f4;color:#536471;font-size:14px;font-weight:600}nav span{padding:16px 0}nav .active{color:#0f1419;border-bottom:4px solid #1d9bf0}
    article,.cell{padding:18px 22px;display:flex;gap:12px;border-bottom:1px solid #eff3f4}.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:50%;display:grid;place-items:center;background:#e6f3ff;color:#087cbd;font-weight:650;font-size:17px}.avatar.amber{background:#fff0d9;color:#a87822}.avatar.mint{background:#dcf6ed;color:#337f68}.avatar.lilac{background:#eee8ff;color:#7958bd}
    .body{min-width:0;flex:1}.user-name{display:flex;align-items:center;flex-wrap:wrap;column-gap:5px;row-gap:2px;font-size:14px}.name-row{display:flex;align-items:center;min-width:0}.name-link{display:inline-flex;align-items:center;min-width:0;gap:3px}.name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}.verified{font-size:10px;color:white;background:#1d9bf0;border-radius:50%;width:13px;height:13px;display:inline-grid;place-items:center;margin-left:4px}.meta{color:#536471;font-size:13px;white-space:nowrap}.post{font-size:15px;line-height:1.65;margin:8px 0 13px}.actions{color:#536471;font-size:12px;display:flex;justify-content:space-between;max-width:410px}.section{font-size:13px;font-weight:700;margin:0;padding:18px 22px 0}.cell .meta{margin-top:3px;display:block}.bio{font-size:14px;line-height:1.6;margin:8px 0 0}.follow{align-self:flex-start;border:0;border-radius:20px;background:#0f1419;color:white;font-weight:600;padding:8px 17px;flex-shrink:0;cursor:pointer}.quote{border:1px solid #cfd9de;border-radius:12px;padding:12px;margin:8px 0}.quote .post{font-size:13px;margin-bottom:0}.small{font-size:12px;color:#536471;padding:16px 22px;line-height:1.8}.awaiting{font-size:12px;color:#536471}
    body.dark{background:#101820;color:#e7e9ea}body.dark main{background:#15202b;border-color:#38444d}body.dark .banner,body.dark nav,body.dark article,body.dark .cell{border-color:#38444d}body.dark .meta,body.dark .note,body.dark .actions,body.dark .small,body.dark nav,body.dark .awaiting{color:#8b98a5}body.dark nav .active{color:#f7f9f9}body.dark .quote{border-color:#38444d}body.dark .follow{background:#eff3f4;color:#0f1419}
    @media(max-width:600px){main{margin:0;border-radius:0;border-inline:0}.banner{padding:18px}article,.cell{padding:16px 12px;gap:9px}.name{max-width:170px}.follow{padding:7px 12px}.user-name{font-size:13px}.meta{font-size:12px}}
  </style>
</head>
<body><main>
  <div class="banner"><span class="eyebrow">INLINE FOLLOWERS</span><h1>名字旁，多一点参考。</h1><p class="note">扩展本地验证页面 · 以下均为合成账号与模拟数字</p></div>
  <nav><span class="active">推荐</span><span>正在关注</span><span>科技</span><span>设计</span></nav>
  <section id="timeline"></section>
  <h2 class="section">粉丝 / 关注列表</h2><section id="people"></section>
  <div class="small">数字来自当前页面已收到的响应。没有可靠数字时留空；悬停徽标可查看完整数量。</div>
</main>
<script>
  const timeline = document.getElementById('timeline');
  const people = document.getElementById('people');
  function header(handle, name, id) {
    return `<div data-testid="User-Name" id="${id}" class="user-name"><div class="name-row"><a class="name-link" href="/${handle}"><span class="name">${name}</span></a><span class="verified">✓</span></div><span class="meta"><a href="/${handle}">@${handle}</a> · 2h</span></div>`;
  }
  function tweet(handle, name, text, id, color='') {
    const article = document.createElement('article');
    article.dataset.testid = 'tweet';
    article.innerHTML = `<div class="avatar ${color}">${name.slice(0,1)}</div><div class="body">${header(handle,name,id)}<div class="post">${text}</div><div class="actions"><span>♡ 117</span><span>⇄ 12</span><span>▥ 9.2K</span><span>↥</span></div></div>`;
    timeline.appendChild(article);
  }
  function cell(handle, name, bio, id, color='') {
    const row=document.createElement('div');
    row.className='cell';row.dataset.testid='UserCell';row.id=id;
    row.innerHTML=`<div class="avatar ${color}">${name.slice(0,1)}</div><div class="body"><div class="name-row"><a class="name-link" href="/${handle}"><span class="name">${name}</span></a><span class="verified">✓</span></div><a class="meta" href="/${handle}">@${handle}</a><p class="bio">${bio}</p></div><button class="follow">关注</button>`;
    people.appendChild(row);
  }
  tweet('demo_174k','Mia Chen','把有价值的信息连起来，才能从收藏走向行动。','tweet-main');
  tweet('demo_11k','林间设计','好的工具可以很小：少打开一个页面，多留一点注意力给内容。','tweet-second','amber');
  tweet('demo_1574','Rowan','今天的实验：用现有数据补上一枚小小的粉丝徽标。','tweet-third','mint');
  tweet('no_number','尚无数字的作者',`这个账号的响应没有粉丝数，因此不显示徽标。<div class="quote">${header('quote_demo','引用作者','quote-name')}<p class="post">引用作者的数据独立匹配，不借给外层作者。</p></div>`,'tweet-missing','lilac');
  cell('demo_423','小舟','AI 工具 · 写作与生活中的小实验','cell-small','amber');
  cell('demo_zero','新来的朋友','有明确的 0，也会如实显示。','cell-zero','mint');
  cell('waiting_demo','等待页面数据','尚未收到可靠数字，先留空。','cell-waiting','lilac');
  window.demo={tweet,cell,header};
  window.initialRequest=fetch('/i/api/graphql/synthetic/HomeTimeline').then(response=>response.json()).then(data=>{window.originalPayload=data;return data;});
</script>
</body>
</html>
